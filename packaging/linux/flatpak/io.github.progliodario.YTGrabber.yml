# Flatpak manifest. Built by .github/workflows/release.yml (see packaging/linux/README.md); locally:
#   flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-dir packaging/linux/flatpak/io.github.progliodario.YTGrabber.yml
#   flatpak build-bundle repo YT-Grabber.flatpak io.github.progliodario.YTGrabber
# The paths below are relative to the repository root (that is where flatpak-builder is run from).
app-id: io.github.progliodario.YTGrabber
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: yt-grabber

finish-args:
  - --share=network                  # YouTube, yt-dlp and ffmpeg downloads
  - --filesystem=xdg-download        # the downloaded files go to ~/Downloads/YT-Grabber
  - --talk-name=org.freedesktop.portal.Desktop   # opens the page in the browser of the host

modules:
  # The runtime has no pip: a Python of our own (same version as the portable one used elsewhere)
  - name: python3
    config-opts:
      - --enable-shared
      - --with-ensurepip=install
    build-options:
      strip: true
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.12.16/Python-3.12.16.tar.xz
        sha256: b5796915dc45ff745cfb4e990a7e7c93d6f546328a102ce31448d69ebc37575c
    cleanup:
      - /share/man
      - '*.a'
      - /lib/python3.12/test
      - /lib/python3.12/idlelib
      - /lib/python3.12/turtledemo
      - /bin/idle*
      - /bin/pydoc*

  - name: yt-grabber
    buildsystem: simple
    build-commands:
      - install -d /app/share/yt-grabber
      - cp -r program /app/share/yt-grabber/
      - find /app/share/yt-grabber -name __pycache__ -prune -exec rm -rf {} +
      - install -Dm755 packaging/linux/flatpak/yt-grabber /app/bin/yt-grabber
      - install -Dm644 packaging/linux/flatpak/io.github.progliodario.YTGrabber.desktop /app/share/applications/io.github.progliodario.YTGrabber.desktop
      - install -Dm644 packaging/linux/flatpak/io.github.progliodario.YTGrabber.metainfo.xml /app/share/metainfo/io.github.progliodario.YTGrabber.metainfo.xml
      - install -Dm644 program/web/icons/icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.progliodario.YTGrabber.png
      - install -Dm644 program/web/icons/icon-192.png /app/share/icons/hicolor/192x192/apps/io.github.progliodario.YTGrabber.png
    sources:
      - type: dir
        path: ../../..
