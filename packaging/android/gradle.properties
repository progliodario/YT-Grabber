org.gradle.daemon=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
# Warning: do NOT add org.gradle.jvmargs. On some recent versions of Windows 11 it would make Gradle create a
# second process that cannot connect to the first one ("Unable to establish loopback connection").
# Memory is set with GRADLE_OPTS, as build.bat does. The signing key data is in
# keystore/keystore.properties (excluded from git).
