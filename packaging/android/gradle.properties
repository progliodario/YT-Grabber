org.gradle.daemon=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
# Warning: org.gradle.jvmargs must stay identical to GRADLE_OPTS in build.bat, including -Xms64m (the Gradle start script adds it).
# If they differ, Gradle starts a second process that, on some recent versions of Windows 11, cannot connect to the first one
# ("Unable to establish loopback connection"). The signing key data is in keystore/keystore.properties (excluded from git).
org.gradle.jvmargs=-Xmx1536m -Xms64m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
