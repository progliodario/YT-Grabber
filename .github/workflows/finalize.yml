name: Finalize

# Runs after the release has all its files (the Release workflow calls it; run it by hand again after uploading the APKs):
#  - signs the .rpm, writes SHA256SUMS and signs it with the project's GPG key
#  - adds build attestations (proof that GitHub's machines built the files from this repository)
#  - builds the signed apt and dnf repositories, installs from them to prove they work, and publishes them on GitHub Pages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the files of the release
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets --pattern '*' --clobber
          rm -f assets/SHA256SUMS assets/SHA256SUMS.asc
          ls -l assets
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_PRIVATE_KEY" || { echo "The GPG_PRIVATE_KEY secret is missing"; exit 1; }
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          echo "FPR=$FPR" >> "$GITHUB_ENV"
          echo "Signing key: $FPR"
      - name: Sign the .rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm createrepo-c
          echo "%_gpg_name $FPR" > ~/.rpmmacros
          rpmsign --addsign assets/*.rpm
          rpm -K assets/*.rpm || true
          gh release upload "$TAG" assets/*.rpm --clobber
      - name: SHA256SUMS and its signature
        run: |
          cd assets
          sha256sum $(ls | grep -v -e '^SHA256SUMS') > SHA256SUMS
          gpg --batch --yes --local-user "$FPR" --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS SHA256SUMS.asc --clobber
      - name: Attest the files built here (the APKs are built on the maintainer's computer, so they are left out)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            assets/*.exe
            assets/*.deb
            assets/*.rpm
            assets/*.AppImage
            assets/*.flatpak
            assets/*.zip
      - name: Build the apt and dnf repositories
        run: sh .github/scripts/build_repos.sh assets site "$FPR"
      - name: Install from the repositories (Ubuntu)
        run: |
          docker run --rm -v "$PWD/site:/site:ro" ubuntu:24.04 sh -c '
            apt-get update -qq && apt-get install -y -qq ca-certificates > /dev/null &&
            install -d /etc/apt/keyrings && cp /site/yt-grabber.gpg /etc/apt/keyrings/yt-grabber.gpg &&
            echo "deb [signed-by=/etc/apt/keyrings/yt-grabber.gpg] file:/site/apt stable main" > /etc/apt/sources.list.d/yt-grabber.list &&
            apt-get update && apt-get install -y yt-grabber && test -x /usr/bin/yt-grabber && dpkg -s yt-grabber | head -n 3'
      - name: Install from the repositories (Fedora)
        run: |
          docker run --rm -v "$PWD/site:/site:ro" fedora:latest sh -c '
            sed "s#baseurl=.*#baseurl=file:///site/rpm#; s#gpgkey=.*#gpgkey=file:///site/yt-grabber.asc#" /site/yt-grabber.repo > /etc/yum.repos.d/yt-grabber.repo &&
            dnf install -y yt-grabber && test -x /usr/bin/yt-grabber && rpm -q yt-grabber'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: finalize
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
