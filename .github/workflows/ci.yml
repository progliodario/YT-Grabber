name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and smoke test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:   # the oldest and the newest Python that the documentation promises, on one system
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.14'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install yt-dlp
        run: python -m pip install "yt-dlp[default]"
      - name: Unused names and errors (pyflakes)
        if: matrix.python == '3.12' && runner.os == 'Linux'
        run: |
          python -m pip install pyflakes
          python -m pyflakes program tests packaging tools
      - name: Security scan of the program (bandit)
        if: matrix.python == '3.12' && runner.os == 'Linux'
        # B310: every address that is opened is an https address of this program or one checked first (the installer);
        # B103: the files made executable are the tools that the program has just downloaded.
        run: |
          python -m pip install bandit
          python -m bandit -r program -ll -q -s B310,B103
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check the JavaScript syntax
        run: |
          for f in program/web/*.js program/web/lang/*.js; do node --check "$f" || exit 1; done
          echo "JavaScript syntax OK"
      - name: Check the links of the documents
        if: runner.os == 'Linux'
        run: python tools/check.py docs
      - name: Start the server and call it
        env:
          YTG_DATA_ROOT: ${{ runner.temp }}/ytg-data
        run: |
          python program/server.py --no-browser --port 8795 --dir "$RUNNER_TEMP/downloads" > "$RUNNER_TEMP/server.log" 2>&1 &
          sh .github/scripts/wait_ping.sh 8795 60 || { cat "$RUNNER_TEMP/server.log"; exit 1; }

  accessibility:
    name: Accessibility audit (axe-core in Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install what the audit needs
        run: python -m pip install "yt-dlp[default]" websockets
      - name: Start the page with sample downloads
        env:
          YTG_DATA_ROOT: ${{ runner.temp }}/a11y-data
        run: |
          python tests/a11y/seed.py "$YTG_DATA_ROOT"
          python program/server.py --no-browser --port 8782 > "$RUNNER_TEMP/server.log" 2>&1 &
          sh .github/scripts/wait_ping.sh 8782 60 || { cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Audit the page (light, dark, list, dialog, Arabic, 320 px, keyboard)
        run: python tests/a11y/audit.py http://localhost:8782/

  android:
    name: Android app builds (Gradle, unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '9.6.0'
      - name: Android SDK platform and build tools
        run: |
          echo "sdk.dir=$ANDROID_HOME" > packaging/android/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Bundled Python packages
        run: python packaging/android/tools/make_libs.py
      - name: Build the APKs (signed with the debug key, which only proves that the app compiles)
        working-directory: packaging/android
        run: gradle --no-daemon assembleRelease
