name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install yt-dlp
        run: python -m pip install "yt-dlp[default]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check the JavaScript syntax
        run: |
          for f in program/web/app.js program/web/lang/*.js; do node --check "$f" || exit 1; done
          echo "JavaScript syntax OK"
      - name: Start the server and call it
        env:
          YTG_DATA_ROOT: ${{ runner.temp }}/ytg-data
        run: |
          python program/server.py --no-browser --port 8795 --dir "$RUNNER_TEMP/downloads" > "$RUNNER_TEMP/server.log" 2>&1 &
          sh .github/scripts/wait_ping.sh 8795 60 || { cat "$RUNNER_TEMP/server.log"; exit 1; }

  accessibility:
    name: Accessibility audit (axe-core in Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install what the audit needs
        run: python -m pip install "yt-dlp[default]" websockets
      - name: Start the page with sample downloads
        env:
          YTG_DATA_ROOT: ${{ runner.temp }}/a11y-data
        run: |
          python tests/a11y/seed.py "$YTG_DATA_ROOT"
          python program/server.py --no-browser --port 8782 > "$RUNNER_TEMP/server.log" 2>&1 &
          sh .github/scripts/wait_ping.sh 8782 60 || { cat "$RUNNER_TEMP/server.log"; exit 1; }
      - name: Audit the page (light, dark, list, dialog, Arabic, 320 px, keyboard)
        run: python tests/a11y/audit.py http://localhost:8782/

  android:
    name: Android app builds (Gradle, unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Android SDK platform and build tools
        run: |
          echo "sdk.dir=$ANDROID_HOME" > packaging/android/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Bundled Python packages
        run: python packaging/android/tools/make_libs.py
      - name: Build the APKs (signed with the debug key, which only proves that the app compiles)
        working-directory: packaging/android
        run: gradle --no-daemon assembleRelease